<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1310 530" width="1310" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>T4 — Closed-loop AI control with a safety supervisor</title>
<defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker></defs>
<rect width="1310" height="530" fill="#ffffff"/>
<text x="655.0" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2937" >T4 — Closed-loop AI control with a safety supervisor</text>
<rect x="30" y="125" width="200" height="90" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="130.0" y="156.2" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >Objective J</text>
<text x="130.0" y="174.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >exposure + λ·energy</text>
<text x="130.0" y="192.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >+ μ·switching</text>
<rect x="290" y="120" width="210" height="100" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="395.0" y="156.2" font-size="13" font-weight="700" text-anchor="middle" fill="#2563eb" >Controller</text>
<text x="395.0" y="174.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >MPC (learned model)</text>
<text x="395.0" y="192.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >or RL policy</text>
<rect x="560" y="120" width="210" height="100" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="665.0" y="156.2" font-size="13" font-weight="700" text-anchor="middle" fill="#ea580c" >Safety supervisor</text>
<text x="665.0" y="174.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >bounds, rate limit</text>
<text x="665.0" y="192.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >fallback to threshold</text>
<rect x="830" y="125" width="180" height="90" rx="8" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5"/>
<text x="920.0" y="165.2" font-size="13" font-weight="700" text-anchor="middle" fill="#dc2626" >Fan + BTS7960</text>
<text x="920.0" y="183.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >PWM duty u</text>
<rect x="1070" y="115" width="210" height="110" rx="8" fill="#fff1e6" stroke="#ea580c" stroke-width="1.5"/>
<text x="1175.0" y="156.2" font-size="13" font-weight="700" text-anchor="middle" fill="#ea580c" >Plant</text>
<text x="1175.0" y="174.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >filter column +</text>
<text x="1175.0" y="192.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >local air near it</text>
<line x1="232" y1="170" x2="288" y2="170" stroke="#374151" stroke-width="1.6" marker-end="url(#a-gray)"/>
<line x1="502" y1="170" x2="558" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
<text x="530" y="160" font-size="12" font-weight="700" text-anchor="middle" fill="#2563eb" >u*</text>
<line x1="772" y1="170" x2="828" y2="170" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/>
<text x="800" y="160" font-size="12" font-weight="700" text-anchor="middle" fill="#dc2626" >u</text>
<line x1="1012" y1="170" x2="1068" y2="170" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/>
<text x="1040" y="160" font-size="11" font-weight="400" text-anchor="middle" fill="#4b5563" >airflow</text>
<rect x="1070" y="30" width="210" height="50" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="1175.0" y="50.2" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937" >Disturbance d</text>
<text x="1175.0" y="68.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >traffic, wind, RH</text>
<line x1="1175" y1="82" x2="1175" y2="113" stroke="#374151" stroke-width="1.6" marker-end="url(#a-gray)"/>
<rect x="1070" y="335" width="210" height="90" rx="8" fill="#fff1e6" stroke="#ea580c" stroke-width="1.5"/>
<text x="1175.0" y="366.2" font-size="13" font-weight="700" text-anchor="middle" fill="#ea580c" >Sensors</text>
<text x="1175.0" y="384.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >PM, CO, RPM, power,</text>
<text x="1175.0" y="402.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >T, RH, ΔP</text>
<rect x="780" y="335" width="220" height="90" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="890.0" y="375.2" font-size="13" font-weight="700" text-anchor="middle" fill="#2563eb" >Calibration + Kalman</text>
<text x="890.0" y="393.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >state estimate x̂</text>
<rect x="480" y="335" width="230" height="90" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="595.0" y="375.2" font-size="13" font-weight="700" text-anchor="middle" fill="#2563eb" >Forecaster</text>
<text x="595.0" y="393.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >ŷ(t+1 … t+H)</text>
<line x1="1175" y1="227" x2="1175" y2="333" stroke="#ea580c" stroke-width="2" marker-end="url(#a-orange)"/>
<text x="1183" y="275.0" font-size="12" font-weight="700" text-anchor="start" fill="#ea580c" >y</text>
<line x1="1068" y1="380" x2="1002" y2="380" stroke="#ea580c" stroke-width="1.6" marker-end="url(#a-orange)"/>
<line x1="778" y1="380" x2="712" y2="380" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-blue)"/>
<text x="745" y="370" font-size="12" font-weight="700" text-anchor="middle" fill="#2563eb" >x̂</text>
<path d="M478,380 L395,380 L395,222" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
<text x="403" y="320" font-size="11" font-weight="400" text-anchor="start" fill="#2563eb" >forecast + state</text>
<path d="M890,333 L890,290 L665,290 L665,222" fill="none" stroke="#374151" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-gray)"/>
<text x="672" y="282" font-size="11" font-weight="400" text-anchor="start" fill="#4b5563" >measured RPM / power: supervisor checks the fan</text>
<rect x="30" y="460" width="1250" height="50" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="655" y="490" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937" >Every 10 s: estimate the state, forecast, choose u*, check it, apply u. If the AI output is invalid or late, the supervisor falls back to the baseline thresholds.</text>
</svg>
