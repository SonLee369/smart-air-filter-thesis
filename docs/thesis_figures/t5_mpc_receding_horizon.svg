<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 635" width="1240" height="635" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>T5 — MPC with a learned model: receding-horizon choice of fan duty</title>
<defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker></defs>
<rect width="1240" height="635" fill="#ffffff"/>
<text x="620.0" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2937" >T5 — MPC with a learned model: receding-horizon choice of fan duty</text>
<line x1="90" y1="330" x2="1010" y2="330" stroke="#374151" stroke-width="1.4"/>
<line x1="90" y1="330" x2="90" y2="90" stroke="#374151" stroke-width="1.4"/>
<text transform="rotate(-90 60 210)" x="60" y="210" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937" >PM near the column</text>
<text x="1018" y="334" font-size="12" font-weight="600" text-anchor="start" fill="#1f2937" >time</text>
<line x1="520" y1="80" x2="520" y2="490" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="520" y="74" font-size="12" font-weight="700" text-anchor="middle" fill="#2563eb" >now (t)</text>
<path d="M90,250 C150,230 190,270 240,240 S330,190 380,215 S470,180 520,175" fill="none" stroke="#374151" stroke-width="2.4"/>
<text x="300" y="102" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4b5563" >measured (past)</text>
<path d="M520,175 C580,165 640,150 720,145 S900,140 1000,138" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1006" y="142" font-size="11.5" font-weight="400" text-anchor="start" fill="#dc2626" >u low: PM keeps rising</text>
<path d="M520,175 C580,180 640,195 720,205 S900,215 1000,220" fill="none" stroke="#a16207" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1006" y="224" font-size="11.5" font-weight="400" text-anchor="start" fill="#a16207" >u medium</text>
<path d="M520,175 C580,195 640,235 720,260 S900,280 1000,285" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1006" y="289" font-size="11.5" font-weight="400" text-anchor="start" fill="#16a34a" >u high: lowest PM, most energy</text>
<path d="M520,338 L520,344 L1000,344 L1000,338" fill="none" stroke="#374151" stroke-width="1.2"/>
<text x="765.0" y="376" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4b5563" >prediction horizon H (e.g. 5–10 steps of 10 s)</text>
<line x1="90" y1="530" x2="1010" y2="530" stroke="#374151" stroke-width="1.4"/>
<line x1="90" y1="530" x2="90" y2="420" stroke="#374151" stroke-width="1.4"/>
<text transform="rotate(-90 60 475)" x="60" y="475" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937" >duty u</text>
<path d="M90,500 L300,500 L300,490 L520,490" fill="none" stroke="#374151" stroke-width="2.2"/>
<rect x="520" y="460" width="80" height="70" fill="#2563eb" fill-opacity="0.55" stroke="#2563eb" stroke-width="1"/>
<rect x="600" y="470" width="80" height="60" fill="#93c5fd" fill-opacity="0.25" stroke="#2563eb" stroke-width="1"/>
<rect x="680" y="475" width="80" height="55" fill="#93c5fd" fill-opacity="0.25" stroke="#2563eb" stroke-width="1"/>
<rect x="760" y="480" width="80" height="50" fill="#93c5fd" fill-opacity="0.25" stroke="#2563eb" stroke-width="1"/>
<rect x="840" y="480" width="80" height="50" fill="#93c5fd" fill-opacity="0.25" stroke="#2563eb" stroke-width="1"/>
<rect x="920" y="485" width="80" height="45" fill="#93c5fd" fill-opacity="0.25" stroke="#2563eb" stroke-width="1"/>
<text x="528" y="412" font-size="12" font-weight="700" text-anchor="start" fill="#2563eb" >apply only u(t), then repeat at t + 10 s</text>
<text x="800" y="450" font-size="11" font-weight="400" text-anchor="middle" fill="#4b5563" >rest of the chosen sequence (discarded)</text>
<rect x="90" y="560" width="920" height="56" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="550" y="584" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2937" >At each step: simulate every candidate duty sequence with the learned plant model, score it with J, keep the best.</text>
<text x="550" y="604" font-size="11" font-weight="400" text-anchor="middle" fill="#4b5563" >Concept sketch: curve shapes are illustrative, not measured data.</text>
</svg>
