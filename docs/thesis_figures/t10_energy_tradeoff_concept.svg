<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>T10 — Energy vs cleanliness: where each controller should land</title>
<defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker></defs>
<rect width="1000" height="510" fill="#ffffff"/>
<text x="500.0" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2937" >T10 — Energy vs cleanliness: where each controller should land</text>
<line x1="110" y1="430" x2="900" y2="430" stroke="#374151" stroke-width="1.4"/>
<line x1="110" y1="430" x2="110" y2="80" stroke="#374151" stroke-width="1.4"/>
<text x="505" y="462" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937" >energy used per hour (Wh)  →  more</text>
<text transform="rotate(-90 62 255)" x="62" y="255" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937" >PM removed (exposure reduction)  →  better</text>
<path d="M150,400 C220,250 380,150 860,110" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<text x="640" y="112" font-size="12" font-weight="700" text-anchor="middle" fill="#2563eb" >front traced by sweeping λ</text>
<path d="M760,150 C620,190 480,230 360,250" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a-blue)"/>
<text x="560" y="238" font-size="11" font-weight="400" text-anchor="middle" fill="#2563eb" >increasing λ (energy matters more)</text>
<circle cx="700" cy="330" r="9" fill="#6b7280" fill-opacity="0.85"/>
<text x="715" y="335" font-size="12" font-weight="600" text-anchor="start" fill="#1f2937" >A · Threshold (baseline)</text>
<circle cx="560" cy="250" r="9" fill="#f59e0b" fill-opacity="0.85"/>
<text x="575" y="255" font-size="12" font-weight="600" text-anchor="start" fill="#1f2937" >B · PID / fuzzy</text>
<circle cx="430" cy="190" r="9" fill="#2563eb" fill-opacity="0.85"/>
<text x="445" y="195" font-size="12" font-weight="600" text-anchor="start" fill="#1f2937" >C · MPC</text>
<circle cx="330" cy="232" r="9" fill="#7c3aed" fill-opacity="0.85"/>
<text x="345" y="237" font-size="12" font-weight="600" text-anchor="start" fill="#1f2937" >D · RL</text>
<rect x="560" y="360" width="330" height="50" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="575" y="382" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937" >Hypothesis H2: C and D sit on the front;</text>
<text x="575" y="400" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937" >A spends more energy for less removal.</text>
<text x="505" y="490" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4b5563" >Concept sketch: point positions are the hypothesis to test, not results.</text>
</svg>
