<text x="640" y="676" font-size="13" font-weight="700" text-anchor="start" fill="#ea580c" >Changes from the baseline wiring</text>
<text x="640" y="704" font-size="11.5" font-weight="400" text-anchor="start" fill="#4b5563" >PMS5003: 5 V supply, 3.3 V UART logic → connects directly to GPIO16/17</text>
<text x="640" y="725" font-size="11.5" font-weight="400" text-anchor="start" fill="#4b5563" >INA219: high side between 12 V PSU + and BTS7960 B+ (check fan current</text>
