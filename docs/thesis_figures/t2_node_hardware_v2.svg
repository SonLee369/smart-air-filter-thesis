<text x="300" y="750" font-size="11.5" font-weight="600" text-anchor="start" fill="#1f2937" >0x44</text>
<text x="370" y="750" font-size="11.5" font-weight="400" text-anchor="start" fill="#4b5563" >3.3 V</text>
