<text x="300" y="774" font-size="11.5" font-weight="600" text-anchor="start" fill="#1f2937" >0x40</text>
<text x="370" y="774" font-size="11.5" font-weight="400" text-anchor="start" fill="#4b5563" >in series with the fan's 12 V line</text>
<text x="60" y="798" font-size="11.5" font-weight="400" text-anchor="start" fill="#4b5563" >SDP810 differential pressure</text>
<text x="300" y="798" font-size="11.5" font-weight="600" text-anchor="start" fill="#1f2937" >0x25</text>
<text x="370" y="798" font-size="11.5" font-weight="400" text-anchor="start" fill="#4b5563" >tubes before / after the filter</text>
