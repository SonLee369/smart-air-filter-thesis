<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 490" width="1060" height="490" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>T9 — Predictive maintenance: warn before efficiency reaches 50 %</title>
<defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker></defs>
<rect width="1060" height="490" fill="#ffffff"/>
<text x="530.0" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2937" >T9 — Predictive maintenance: warn before efficiency reaches 50 %</text>
<line x1="100" y1="400" x2="960" y2="400" stroke="#374151" stroke-width="1.4"/>
<line x1="100" y1="400" x2="100" y2="90" stroke="#374151" stroke-width="1.4"/>
<text x="530" y="430" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937" >days in service</text>
<text transform="rotate(-90 60 245)" x="60" y="245" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937" >filter efficiency η</text>
<line x1="100" y1="300" x2="960" y2="300" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="92" y="304" font-size="11.5" font-weight="700" text-anchor="end" fill="#dc2626" >50 %</text>
<text x="960" y="292" font-size="11" font-weight="400" text-anchor="end" fill="#dc2626" >baseline alarm level</text>
<path d="M100,130 L130,138 L160,133 L190,146 L220,142 L250,155 L280,152 L310,166 L340,163 L370,176 L400,174 L430,186 L460,184 L490,197 L520,196" fill="none" stroke="#374151" stroke-width="2.2"/>
<text x="300" y="125" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4b5563" >daily η estimate (measured so far)</text>
<line x1="520" y1="90" x2="520" y2="400" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="520" y="82" font-size="12" font-weight="700" text-anchor="middle" fill="#2563eb" >today</text>
<path d="M520,196 L860,300 L860,398 L520,196 Z" fill="#2563eb" fill-opacity="0.12" stroke="none"/>
<path d="M520,196 L860,349" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/>
<text x="700" y="222" font-size="11.5" font-weight="400" text-anchor="middle" fill="#2563eb" >forecast + uncertainty band</text>
<line x1="751" y1="300" x2="751" y2="400" stroke="#16a34a" stroke-width="1.5"/>
<rect x="695" y="394" width="165" height="12" rx="6" fill="#16a34a" fill-opacity="0.25"/>
<text x="751" y="450" font-size="11.5" font-weight="700" text-anchor="middle" fill="#16a34a" >predicted replacement day (with range)</text>
<line x1="524" y1="360" x2="745" y2="360" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-green)" marker-start="url(#a-green)"/>
<text x="635" y="352" font-size="11" font-weight="400" text-anchor="middle" fill="#16a34a" >lead time for maintenance</text>
<text x="530" y="470" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4b5563" >Concept sketch, no data: inputs are η trend, RPM at fixed duty, motor current and ΔP.</text>
</svg>
