<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" width="1000" height="565" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>T1 — System architecture v2: AI closes the loop on the node</title>
<defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker></defs>
<rect width="1000" height="565" fill="#ffffff"/>
<text x="500.0" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2937" >T1 — System architecture v2: AI closes the loop on the node</text>
<rect x="30" y="70" width="520" height="440" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="50" y="96" font-size="14" font-weight="700" text-anchor="start" fill="#1f2937" >Filter column node · ESP32 (30-pin)</text>
<rect x="50" y="112" width="480" height="110" rx="8" fill="#fff1e6" stroke="#ea580c" stroke-width="1.5"/>
<text x="290.0" y="135.2" font-size="13" font-weight="700" text-anchor="middle" fill="#ea580c" >Sensors</text>
<text x="290.0" y="153.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >GP2Y1010 ×2 + PMS5003 reference (PM2.5)</text>
<text x="290.0" y="171.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >MQ-7 ×2 (CO in / out)</text>
<text x="290.0" y="189.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >SHT31 (T, RH) · ΔP sensor across the filter</text>
<text x="290.0" y="207.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >INA219 (fan power) · KY-003 Hall (RPM)</text>
<rect x="50" y="252" width="480" height="120" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="290.0" y="280.2" font-size="13" font-weight="700" text-anchor="middle" fill="#2563eb" >Edge AI on the ESP32 (TFLite Micro / emlearn)</text>
<text x="290.0" y="298.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >Calibration + Kalman filter (C2)</text>
<text x="290.0" y="316.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >Forecast PM2.5 / CO, +1 … +15 min (C3)</text>
<text x="290.0" y="334.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >MPC or RL policy → fan duty u every 10 s (C4)</text>
<text x="290.0" y="352.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >Fallback: baseline threshold controller</text>
<rect x="50" y="402" width="230" height="84" rx="8" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5"/>
<text x="165.0" y="430.2" font-size="13" font-weight="700" text-anchor="middle" fill="#dc2626" >Fan drive</text>
<text x="165.0" y="448.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >BTS7960, PWM 20 kHz</text>
<text x="165.0" y="466.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >duty u ∈ [0, 1]</text>
<rect x="300" y="402" width="230" height="84" rx="8" fill="#eef2f7" stroke="#475569" stroke-width="1.5"/>
<text x="415.0" y="430.2" font-size="13" font-weight="700" text-anchor="middle" fill="#475569" >Local log</text>
<text x="415.0" y="448.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >SD card, 1 s samples</text>
<text x="415.0" y="466.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >survives LoRa loss</text>
<line x1="290" y1="224" x2="290" y2="250" stroke="#ea580c" stroke-width="1.6" marker-end="url(#a-orange)"/>
<text x="298" y="242" font-size="11" font-weight="400" text-anchor="start" fill="#4b5563" >raw readings</text>
<line x1="165" y1="374" x2="165" y2="400" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-blue)"/>
<text x="173" y="392" font-size="11" font-weight="400" text-anchor="start" fill="#4b5563" >u</text>
<line x1="415" y1="374" x2="415" y2="400" stroke="#374151" stroke-width="1.6" marker-end="url(#a-gray)"/>
<path d="M50,444 L40,444 L40,167 L48,167" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-purple)"/>
<rect x="640" y="70" width="330" height="440" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="660" y="96" font-size="14" font-weight="700" text-anchor="start" fill="#1f2937" >Gateway and server</text>
<rect x="660" y="112" width="290" height="96" rx="8" fill="#e7f6ec" stroke="#16a34a" stroke-width="1.5"/>
<text x="805.0" y="146.2" font-size="13" font-weight="700" text-anchor="middle" fill="#16a34a" >Gateway (ESP32, 38-pin)</text>
<text x="805.0" y="164.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >LoRa RX + packet validation</text>
<text x="805.0" y="182.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >Downlink: settings, model (OTA)</text>
<rect x="660" y="238" width="290" height="120" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="805.0" y="275.2" font-size="13" font-weight="700" text-anchor="middle" fill="#7c3aed" >Data store + training (PC)</text>
<text x="805.0" y="293.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >Season-long dataset (C1)</text>
<text x="805.0" y="311.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >Forecast, plant model, RL</text>
<text x="805.0" y="329.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >int8 export (C5) · filter life (C6)</text>
<rect x="660" y="388" width="290" height="98" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="805.0" y="423.2" font-size="13" font-weight="700" text-anchor="middle" fill="#7c3aed" >Web dashboard</text>
<text x="805.0" y="441.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >Live PM, CO, energy, filter life</text>
<text x="805.0" y="459.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >Controller A / B / C / D select</text>
<line x1="805" y1="210" x2="805" y2="236" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-green)"/>
<line x1="805" y1="360" x2="805" y2="386" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a-purple)"/>
<path d="M532,290 L590,290 L590,150 L658,150" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#a-teal)"/>
<path d="M658,186 L606,186 L606,334 L532,334" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-green)"/>
<text x="598" y="62" font-size="12" font-weight="700" text-anchor="middle" fill="#0d9488" >LoRa 433 MHz</text>
<line x1="40" y1="540" x2="80" y2="540" stroke="#0d9488" stroke-width="2" marker-end="url(#a-teal)"/>
<text x="88" y="544" font-size="11" font-weight="400" text-anchor="start" fill="#4b5563" >data uplink (packet v2, every 10 s)</text>
<line x1="340" y1="540" x2="380" y2="540" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-green)"/>
<text x="388" y="544" font-size="11" font-weight="400" text-anchor="start" fill="#4b5563" >settings and model downlink (OTA)</text>
<line x1="640" y1="540" x2="680" y2="540" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-purple)"/>
<text x="688" y="544" font-size="11" font-weight="400" text-anchor="start" fill="#4b5563" >airflow changes what the sensors read</text>
</svg>
