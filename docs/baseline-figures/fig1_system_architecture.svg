<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 435" width="970" height="435" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Fig 1 — System architecture</title>
<defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker></defs>
<rect width="970" height="435" fill="#ffffff"/>
<text x="485.0" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2937" >Fig 1 — System architecture</text>
<rect x="30" y="75" width="250" height="200" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="155.0" y="125.2" font-size="13" font-weight="700" text-anchor="middle" fill="#2563eb" >Filter column node</text>
<text x="155.0" y="143.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >ESP32-WROOM (30-pin)</text>
<text x="155.0" y="161.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >2× GP2Y1010 dust (in / out)</text>
<text x="155.0" y="179.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >2× MQ-7 CO (in / out)</text>
<text x="155.0" y="197.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >Fan + BTS7960 + KY-003 Hall</text>
<text x="155.0" y="215.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >DS1307 RTC</text>
<text x="155.0" y="233.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >LoRa Ra-02 (TX)</text>
<rect x="400" y="95" width="220" height="160" rx="8" fill="#e7f6ec" stroke="#16a34a" stroke-width="1.5"/>
<text x="510.0" y="143.2" font-size="13" font-weight="700" text-anchor="middle" fill="#16a34a" >Gateway</text>
<text x="510.0" y="161.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >ESP32-WROOM (38-pin)</text>
<text x="510.0" y="179.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >LoRa Ra-02 (RX) + validate</text>
<text x="510.0" y="197.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >Latest packet kept in RAM</text>
<text x="510.0" y="215.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >WebServer :80 + LittleFS</text>
<rect x="740" y="95" width="200" height="160" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="840.0" y="143.2" font-size="13" font-weight="700" text-anchor="middle" fill="#7c3aed" >Web dashboard</text>
<text x="840.0" y="161.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >Phone / PC browser</text>
<text x="840.0" y="179.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >GET /  → index.html</text>
<text x="840.0" y="197.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >GET /get-data → JSON</text>
<text x="840.0" y="215.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >polled every 2 s</text>
<line x1="282" y1="175" x2="398" y2="175" stroke="#0d9488" stroke-width="2.2" marker-end="url(#a-teal)"/>
<text x="340" y="150" font-size="12" font-weight="600" text-anchor="middle" fill="#0d9488" >LoRa 433 MHz</text>
<text x="340" y="165" font-size="11" font-weight="400" text-anchor="middle" fill="#4b5563" >SF7 · 125 kHz</text>
<text x="340" y="195" font-size="11" font-weight="400" text-anchor="middle" fill="#4b5563" >SensorPacket</text>
<text x="340" y="209" font-size="11" font-weight="400" text-anchor="middle" fill="#4b5563" >30 B, every 5 s</text>
<line x1="622" y1="175" x2="738" y2="175" stroke="#16a34a" stroke-width="2.2" marker-end="url(#a-green)" marker-start="url(#a-green)"/>
<text x="680" y="150" font-size="12" font-weight="600" text-anchor="middle" fill="#16a34a" >WiFi (STA)</text>
<text x="680" y="165" font-size="11" font-weight="400" text-anchor="middle" fill="#4b5563" >HTTP :80</text>
<text x="680" y="195" font-size="11" font-weight="400" text-anchor="middle" fill="#4b5563" >JSON / HTML</text>
<rect x="30" y="310" width="110" height="42" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="85.0" y="335.2" font-size="13" font-weight="700" text-anchor="middle" fill="#2563eb" >Node 2</text>
<rect x="170" y="310" width="110" height="42" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="225.0" y="335.2" font-size="13" font-weight="700" text-anchor="middle" fill="#2563eb" >Node n</text>
<path d="M85,352 C90,395 440,395 470,257" fill="none" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-teal)"/>
<path d="M280,331 C380,331 450,310 500,257" fill="none" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-teal)"/>
<text x="250" y="418" font-size="11" font-weight="400" text-anchor="middle" fill="#4b5563" >More columns: same protocol, own senderId (star topology)</text>
</svg>
