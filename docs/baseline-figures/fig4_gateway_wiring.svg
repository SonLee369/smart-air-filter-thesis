<text x="60" y="725" font-size="13" font-weight="700" text-anchor="start" fill="#ea580c" >Notes</text>
<text x="60" y="749" font-size="11.5" font-weight="400" text-anchor="start" fill="#4b5563" >• Ra-02 is a 3.3 V part: never connect its VCC to 5 V. Fit the 433 MHz antenna before transmitting.</text>
<text x="60" y="768" font-size="11.5" font-weight="400" text-anchor="start" fill="#4b5563" >• DIO0 uses GPIO26, not GPIO2 (GPIO2 is a boot strapping pin and drives the on-board LED).</text>
<text x="60" y="787" font-size="11.5" font-weight="400" text-anchor="start" fill="#4b5563" >• Pin order follows the common DevKitC layout; check the silkscreen of your board.</text>
<text x="60" y="806" font-size="11.5" font-weight="400" text-anchor="start" fill="#4b5563" >• Same SPI pins as the node (VSPI 18/19/23/5), so one wiring habit for both boards.</text>
</svg>
