<text x="875.0" y="366.35" font-size="11" font-weight="400" text-anchor="middle" fill="#4b5563" >keeps GPIO34 ≤ 3.3 V</text>
<line x1="740" y1="354" x2="788" y2="354" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-blue)"/>
<rect x="790" y="400" width="170" height="140" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="802" y="422" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937" >5 V budget (approx.)</text>
<text x="802" y="445" font-size="11" font-weight="400" text-anchor="start" fill="#4b5563" >ESP32 + 3.3 V ≈ 200 mA pk</text>
<text x="802" y="464" font-size="11" font-weight="400" text-anchor="start" fill="#4b5563" >MQ-7 2 × ≈ 70 mA</text>
<text x="802" y="483" font-size="11" font-weight="400" text-anchor="start" fill="#4b5563" >GP2Y 2 × ≈ 20 mA</text>
<text x="802" y="502" font-size="11" font-weight="400" text-anchor="start" fill="#4b5563" >DS1307 &lt; 1 mA</text>
<text x="802" y="521" font-size="11" font-weight="600" text-anchor="start" fill="#16a34a" >Total ≈ 380 mA &lt; 1 A ✓</text>
<rect x="30" y="570" width="930" height="26" rx="5" fill="#111827"/>
<text x="495" y="588" font-size="12" font-weight="700" text-anchor="middle" fill="#f9fafb" >COMMON GND — 12 V PSU −, 5 V adapter −, ESP32 GND, all modules</text>
