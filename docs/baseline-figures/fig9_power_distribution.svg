<text x="712" y="188" font-size="10" font-weight="400" text-anchor="end" fill="#4b5563" >B−</text>
<rect x="30" y="360" width="170" height="160" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="42" y="382" font-size="12" font-weight="700" text-anchor="start" fill="#ea580c" >Bench tip</text>
<text x="42" y="404" font-size="11" font-weight="400" text-anchor="start" fill="#4b5563" >A PC USB port alone</text>
<text x="42" y="422" font-size="11" font-weight="400" text-anchor="start" fill="#4b5563" >cannot feed the MQ-7</text>
<text x="42" y="440" font-size="11" font-weight="400" text-anchor="start" fill="#4b5563" >heaters + LoRa: power</text>
<text x="42" y="458" font-size="11" font-weight="400" text-anchor="start" fill="#4b5563" >sensors from the 5 V</text>
<text x="42" y="476" font-size="11" font-weight="400" text-anchor="start" fill="#4b5563" >adapter to avoid brown-</text>
<text x="42" y="494" font-size="11" font-weight="400" text-anchor="start" fill="#4b5563" >outs / USB drop-outs.</text>
