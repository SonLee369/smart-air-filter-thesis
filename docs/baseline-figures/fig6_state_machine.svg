<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" width="980" height="650" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Fig 6 — Node control state machine</title>
<defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker></defs>
<rect width="980" height="650" fill="#ffffff"/>
<text x="490.0" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2937" >Fig 6 — Node control state machine</text>
<rect x="80" y="190" width="250" height="110" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="205.0" y="222.2" font-size="13" font-weight="700" text-anchor="middle" fill="#2563eb" >MEASURING</text>
<text x="205.0" y="240.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >fan duty 0.22 (≈ 1 320 RPM)</text>
<text x="205.0" y="258.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >motor + filter checks active</text>
<text x="205.0" y="276.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >start state</text>
<rect x="650" y="190" width="250" height="110" rx="8" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5"/>
<text x="775.0" y="222.2" font-size="13" font-weight="700" text-anchor="middle" fill="#dc2626" >FILTERING</text>
<text x="775.0" y="240.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >fan duty 0.52 (≈ 3 120 RPM)</text>
<text x="775.0" y="258.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >motor + filter checks active</text>
<text x="775.0" y="276.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >minimum 60 s</text>
<rect x="355" y="430" width="270" height="110" rx="8" fill="#eef2f7" stroke="#475569" stroke-width="1.5"/>
<text x="490.0" y="462.2" font-size="13" font-weight="700" text-anchor="middle" fill="#475569" >SELF_TEST</text>
<text x="490.0" y="480.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >fan duty 0.22</text>
<text x="490.0" y="498.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >30 s settle + 10 s average</text>
<text x="490.0" y="516.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >→ set MQ-7 / GP2Y fault flags</text>
<circle cx="40" cy="245" r="9" fill="#111827"/>
<line x1="49" y1="245" x2="78" y2="245" stroke="#374151" stroke-width="1.6" marker-end="url(#a-gray)"/>
<text x="52" y="228" font-size="11" font-weight="400" text-anchor="start" fill="#4b5563" >boot</text>
<path d="M330,215 Q490,110 650,215" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/>
<text x="490" y="132" font-size="12" font-weight="600" text-anchor="middle" fill="#dc2626" >settled ≥ 10 s  AND  (CO_in &gt; 50 ppm  OR  PM_in &gt; 35 µg/m³)</text>
<path d="M650,280 Q490,375 330,280" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
<text x="490" y="360" font-size="12" font-weight="600" text-anchor="middle" fill="#2563eb" >≥ 60 s  AND  CO_in &lt; 40 ppm  AND  PM_in &lt; 28 µg/m³</text>
<text x="490" y="376" font-size="11" font-weight="400" text-anchor="middle" fill="#4b5563" >(80 % hysteresis avoids rapid on/off)</text>
<line x1="760" y1="300" x2="610" y2="428" stroke="#374151" stroke-width="1.6" marker-end="url(#a-gray)"/>
<text x="728" y="395" font-size="11" font-weight="600" text-anchor="start" fill="#4b5563" >RTC 00:00 or 't'</text>
<line x1="245" y1="300" x2="400" y2="428" stroke="#374151" stroke-width="1.6" marker-end="url(#a-gray)"/>
<text x="210" y="395" font-size="11" font-weight="600" text-anchor="start" fill="#4b5563" >RTC 00:00 or 't'</text>
<path d="M355,505 Q170,505 150,302" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<text x="170" y="530" font-size="11" font-weight="600" text-anchor="middle" fill="#2563eb" >done (≈ 40 s) → MEASURING</text>
<rect x="80" y="565" width="820" height="66" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="100" y="590" font-size="11.5" font-weight="400" text-anchor="start" fill="#4b5563" >Always on (MEASURING/FILTERING): motor check |RPM − duty·6000| ≤ 35 % (3 s to flag) · filter check η ≥ 50 % (≈ 60 s to flag)</text>
<text x="100" y="612" font-size="11.5" font-weight="400" text-anchor="start" fill="#4b5563" >Bench test: 'fan m' / 'fan f' hold a state (decision skipped), 'fan auto' resumes, 'sim …' overrides readings</text>
</svg>
