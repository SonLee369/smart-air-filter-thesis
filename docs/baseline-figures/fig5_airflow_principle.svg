<text x="805.0" y="367.2" font-size="12" font-weight="400" text-anchor="middle" fill="#4b5563" >≥ 60 s and both below 80 % of threshold → MEASURING</text>
<rect x="60" y="425" width="980" height="80" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="550" y="452" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2937" >Filter efficiency η = (in − out) / in × 100 %   ·   η_total = (η_PM + η_CO) / 2   ·   η &lt; 50 % for ≈ 60 s → REPLACE FILTER</text>
<text x="550" y="482" font-size="12.5" font-weight="400" text-anchor="middle" fill="#4b5563" >Airflow  Q = k · (2π · r · RPM / 60) · A,   k = 0.6   (thesis eq. 3–5)</text>
